<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VECL-QB Cockpit</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div>
            <div class="brand">VECL-QB</div>
            <div class="subtle">local cockpit</div>
          </div>
          <button class="icon-btn" id="collapseSidebar" title="Collapse sidebar">[</button>
        </div>
        <button class="primary-line" id="newSession">New conversation</button>
        <section class="side-section">
          <h2>Sessions</h2>
          <div class="session-list" id="sessionList"></div>
        </section>
        <section class="side-section specialists-section">
          <h2>Specialists</h2>
          <div class="specialist-list" id="specialistList"></div>
        </section>
      </aside>

      <main class="chat-main">
        <header class="topbar">
          <button class="icon-btn mobile-toggle" id="openSidebar" title="Toggle sidebar">[</button>
          <div>
            <div class="top-title">Research cockpit</div>
            <div class="top-meta" id="driverMeta">Driver not selected</div>
          </div>
          <div class="top-actions">
            <div class="cost-pill" id="costPill">$0.00000000</div>
            <button class="icon-btn" id="toggleDrawer" title="Toggle drawer">]</button>
          </div>
        </header>

        <section class="messages" id="messages"></section>

        <section class="working" id="workingIndicator" hidden>
          <div class="working-line">
            <span class="pulse"></span>
            <span id="workingText">Working</span>
          </div>
          <div class="step-strip" id="stepStrip"></div>
        </section>

        <form class="composer" id="composerForm">
          <div class="composer-tools">
            <select id="driverSelect" aria-label="Model driver"></select>
            <button type="button" class="tool-btn" id="payloadToggle">Payload</button>
          </div>
          <div class="payload-box" id="payloadBox" hidden>
            <div class="payload-toolbar">
              <select id="payloadPreset" aria-label="Specialist payload preset">
                <option value="">Custom payload</option>
              </select>
              <button type="button" class="tool-btn" id="applyPayloadPreset">Use preset</button>
            </div>
            <div class="payload-warning" id="payloadWarning" hidden></div>
            <textarea
              id="payloadInput"
              spellcheck="false"
              placeholder='{"task_type":"chess_eval","input_payload":{"fen":"...","depth":12}}'
            ></textarea>
          </div>
          <div class="composer-row">
            <textarea id="promptInput" rows="1" placeholder="Message VECL-QB"></textarea>
            <button class="send-btn" id="sendButton" type="submit">Send</button>
          </div>
        </form>
      </main>

      <aside class="drawer" id="drawer">
        <div class="drawer-head">
          <div>
            <div class="drawer-title">Trace</div>
            <div class="drawer-subtitle" id="runMeta">No run selected</div>
          </div>
          <button class="icon-btn" id="closeDrawer" title="Close drawer">x</button>
        </div>
        <nav class="tabs" id="tabs">
          <button class="tab active" data-tab="artifacts">Artifacts</button>
          <button class="tab" data-tab="provenance">Provenance</button>
          <button class="tab" data-tab="raw">Raw</button>
          <button class="tab" data-tab="tool">Tool</button>
        </nav>
        <section class="tab-panel active" id="tab-artifacts">
          <div class="artifact-list" id="artifactList"></div>
          <div class="artifact-viewer" id="artifactViewer"></div>
        </section>
        <section class="tab-panel" id="tab-provenance">
          <div class="timeline" id="timeline"></div>
        </section>
        <section class="tab-panel" id="tab-raw">
          <div class="raw-list" id="rawList"></div>
        </section>
        <section class="tab-panel" id="tab-tool">
          <div class="tool-state" id="toolState"></div>
        </section>
      </aside>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
